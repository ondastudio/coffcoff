<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>coffcoff — mural</title>
  <link rel="stylesheet" href="/style.css" />
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
  <h1>coffcoff mural</h1>

  <form id="message-form">
    <textarea
      id="message-text"
      maxlength="280"
      rows="3"
      placeholder="Say something..."
      required
    ></textarea>
    <div class="cf-turnstile" data-sitekey="0x4AAAAAAE_B542UhKL2NbEI"></div>
    <div class="form-footer">
      <span id="char-counter">0 / 280</span>
      <button type="submit">Post</button>
    </div>
    <p id="form-error" class="error" hidden></p>
  </form>

  <section id="feed" aria-live="polite"></section>
  <button id="load-more" hidden>Load more</button>

  <script src="/app.js"></script>
</body>
</html>
